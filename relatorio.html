<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório BNCC</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="mobile-nav"><div class="brand"><div class="brand-icon">📖</div><h1>AtivaEdu</h1></div><a class="btn-secondary" href="criar-relatorio.html">Voltar</a></div>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">📖</div><div><h1>AtivaEdu</h1><small>Sistema de Atividades</small></div></div><nav><a href="index.html">⌂ Início</a><a href="criar-atividade.html">✍ Criar atividade</a><a href="atividades.html">▣ Minhas atividades</a><a href="criar-relatorio.html">🧒 Relatórios BNCC</a></nav><div class="sidebar-bottom"><button class="logout" onclick="logout()">Sair</button></div></aside>
<main><div class="topbar no-print"><div><h2>Relatório do(a) estudante</h2><p>Revise e ajuste antes de imprimir.</p></div><div class="actions"><button class="btn-secondary" onclick="enableEdit()">Editar texto</button><button class="btn-primary" onclick="window.print()">Imprimir / Salvar PDF</button></div></div><section id="sheet" class="panel report-sheet"></section></main></div>
<script src="app.js"></script><script>
const user=requireAuth();let item=Store.getReports().find(r=>String(r.id)===qs('id')&&r.userId===user.id);
function paras(text){return escapeHtml(text||'').split(/\n\s*\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
function render(){if(!item){sheet.innerHTML='<div class="empty">Relatório não encontrado.</div>';return}sheet.innerHTML='<div class="report-title"><h2>'+escapeHtml(item.title)+'</h2><p><strong>Estudante:</strong> '+escapeHtml(item.childName)+' &nbsp; • &nbsp; <strong>Ano/Série:</strong> '+escapeHtml(item.group)+' &nbsp; • &nbsp; <strong>Período:</strong> '+escapeHtml(item.period)+'</p></div><div id="reportText" class="report-text">'+paras(item.summary)+'</div>'+(item.bnccHighlights?.length?'<div class="bncc-box"><strong>Alinhamento pedagógico à BNCC</strong><ul>'+item.bnccHighlights.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul></div>':'')+(item.nextSteps?.length?'<div class="next-box"><strong>Possibilidades de continuidade</strong><ul>'+item.nextSteps.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul></div>':'')+'<div class="signature"><span>________________________________________<br>Professor(a)</span><span>____/____/______</span></div>'}
function enableEdit(){const el=document.getElementById('reportText');if(!el)return;const raw=item.summary||'';el.innerHTML='<textarea id="editSummary" class="report-editor">'+escapeHtml(raw)+'</textarea><div class="actions no-print"><button class="btn-primary" onclick="saveEdit()">Salvar alteração</button><button class="btn-secondary" onclick="render()">Cancelar</button></div>'}
function saveEdit(){const value=document.getElementById('editSummary').value.trim();if(!value)return;item.summary=value;Store.saveReports(Store.getReports().map(r=>r.id===item.id?item:r));toast('Relatório atualizado.');render()}
render();
</script></body></html>
