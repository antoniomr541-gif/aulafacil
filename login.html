<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtivaEdu — Entrar</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="auth-shell"><section class="auth-left"><h1>📖 AtivaEdu</h1><p>Crie atividades, provas e materiais adaptados em poucos minutos.</p><p>✓ Login individual<br>✓ Gabarito<br>✓ Histórico<br>✓ Impressão em PDF</p></section>
<section class="auth-right"><div class="auth-card"><div class="brand"><div class="brand-icon">📖</div><div><h1>AtivaEdu</h1><small>Sistema de Atividades</small></div></div>
<div class="auth-tabs"><button id="tabLogin" class="active">Entrar</button><button id="tabRegister">Cadastrar</button></div>
<form id="loginForm"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="loginPassword" type="password" required></div><button class="btn-primary" style="width:100%;margin-top:18px">Entrar</button></form>
<form id="registerForm" class="hidden"><div class="field"><label>Nome</label><input id="regName" required></div><div class="field" style="margin-top:12px"><label>E-mail</label><input id="regEmail" type="email" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="regPassword" type="password" minlength="4" required></div><button class="btn-primary" style="width:100%;margin-top:18px">Criar conta</button></form>
<p class="muted" style="font-size:12px;margin-top:18px">Os dados ficam salvos neste aparelho.</p></div></section></div>
<script src="app.js"></script><script>
if(Store.getSession())location.href='index.html';
tabLogin.onclick=()=>{tabLogin.classList.add('active');tabRegister.classList.remove('active');loginForm.classList.remove('hidden');registerForm.classList.add('hidden')};
tabRegister.onclick=()=>{tabRegister.classList.add('active');tabLogin.classList.remove('active');registerForm.classList.remove('hidden');loginForm.classList.add('hidden')};
registerForm.onsubmit=e=>{e.preventDefault();const u=Store.getUsers(),email=regEmail.value.trim().toLowerCase();if(u.some(x=>x.email===email))return toast('E-mail já cadastrado.');const n={id:Date.now(),name:regName.value.trim(),email,password:regPassword.value};u.push(n);Store.saveUsers(u);Store.setSession({id:n.id,name:n.name,email:n.email});location.href='index.html'};
loginForm.onsubmit=e=>{e.preventDefault();const u=Store.getUsers().find(x=>x.email===loginEmail.value.trim().toLowerCase()&&x.password===loginPassword.value);if(!u)return toast('E-mail ou senha incorretos.');Store.setSession({id:u.id,name:u.name,email:u.email});location.href='index.html'};
</script></body></html>
