<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criar atividade - AtivaEdu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h1>✨ Criar atividade</h1>

<h3>1. O que deseja criar?</h3>
<select>
<option>Atividade</option>
<option>Prova</option>
<option>Lista de exercícios</option>
<option>Plano de aula</option>
<option>Texto com interpretação</option>
<option>Jogo educativo</option>
</select>

<h3>2. Matéria</h3>
<select>
<option>Língua Portuguesa</option>
<option>Matemática</option>
<option>Ciências</option>
<option>História</option>
<option>Geografia</option>
<option>Artes</option>
<option>Inglês</option>
<option>Educação Física</option>
<option>Biologia</option>
<option>Física</option>
<option>Química</option>
</select>

<h3>3. Personalização</h3>
<label><input type="checkbox"> Com imagens</label><br>
<label><input type="checkbox"> Adaptada TEA/TDAH</label><br>
<label><input type="checkbox"> Gabarito separado</label><br>
<label><input type="checkbox"> Relatório pedagógico</label>

<br><br>
<button onclick="alert('Atividade preparada! Próxima etapa será conectar a IA.')">✨ Gerar atividade</button>
</div>
</body>
</html>
