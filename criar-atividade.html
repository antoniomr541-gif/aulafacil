<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar atividade</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="mobile-nav"><div class="brand"><div class="brand-icon">📖</div><h1>AtivaEdu</h1></div><a class="btn-secondary" href="index.html">Início</a></div>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brand-icon">📖</div><div><h1>AtivaEdu</h1><small>Sistema de Atividades</small></div></div>
<nav><a href="index.html">⌂ Início</a><a href="criar-atividade.html">✍ Criar atividade</a><a href="atividades.html">▣ Minhas atividades</a><a href="criar-relatorio.html">🧒 Relatórios BNCC</a></nav>
<div class="sidebar-bottom"><button class="logout" onclick="logout()">Sair</button></div>
</aside>
<main><div class="topbar"><div><h2>Criar atividade</h2><p>Preencha as opções abaixo.</p></div></div>
<form id="form" class="panel"><div class="form-grid">
<div class="field"><label>Título</label><input id="title" required placeholder="Ex.: Revisão de Matemática"></div>
<div class="field"><label>Ano/Série</label><select id="grade" required><option value="">Selecione</option><option>Educação Infantil - G4 (4 anos)</option><option>Educação Infantil - G5 (5 anos)</option><option>1º ano</option><option>2º ano</option><option>3º ano</option><option>4º ano</option><option>5º ano</option><option>6º ano</option><option>7º ano</option><option>8º ano</option><option>9º ano</option></select></div>
<div class="field"><label>Disciplina</label><select id="subject" required><option value="">Selecione</option><option>Educação Infantil / Campos de Experiência</option><option>Matemática</option><option>Língua Portuguesa</option><option>Ciências</option><option>História</option><option>Geografia</option></select></div>
<div class="field"><label>Tema</label><input id="topic" required placeholder="Ex.: adição e subtração"></div>
<div class="field"><label>Quantidade</label><input id="quantity" type="number" min="5" max="30" value="10"></div>
<div class="field"><label>Tipo</label><select id="questionType"><option value="objetiva">Objetivas</option><option value="discursiva">Discursivas</option><option value="mista">Mistas</option></select></div>
<div class="field full"><label>Instruções adicionais</label><textarea id="instructions" placeholder="Ex.: questões fáceis e linguagem simples"></textarea></div>
<div class="field full"><div class="switches"><label class="switch-card"><input id="illustrated" type="checkbox">Com ilustrações</label><label class="switch-card"><input id="adapted" type="checkbox">Adaptada para TEA/TDAH</label><label class="switch-card"><input id="blackWhite" type="checkbox" checked>Preto e branco</label></div></div>
<div class="field full"><button class="btn-primary">Gerar atividade</button></div></div></form></main></div>
<script src="app.js"></script><script>
const user=requireAuth();if(qs('adaptada'))adapted.checked=true;
form.onsubmit=async e=>{
  e.preventDefault();
  const button=form.querySelector('button[type="submit"],button.btn-primary');
  const original=button.textContent;
  button.disabled=true;button.textContent=illustrated.checked?'Gerando atividade e ilustração...':'Gerando atividade...';
  try{
    const payload={subject:subject.value,grade:grade.value,topic:topic.value.trim(),quantity:Number(quantity.value),questionType:questionType.value,illustrated:illustrated.checked,adapted:adapted.checked,blackWhite:blackWhite.checked,instructions:instructions.value.trim()};
    const response=await fetch('/api/generate-activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const generated=await response.json();
    if(!response.ok)throw new Error(generated.error||'Não foi possível gerar a atividade.');
    const item={id:Date.now(),userId:user.id,title:title.value.trim()||generated.title,grade:payload.grade,subject:payload.subject,topic:payload.topic,questionType:payload.questionType,illustrated:payload.illustrated,adapted:payload.adapted,blackWhite:payload.blackWhite,instructions:payload.instructions,questions:generated.questions,illustration:generated.illustration,illustrationWarning:generated.illustrationWarning,createdAt:new Date().toISOString()};
    const items=Store.getActivities();items.unshift(item);Store.saveActivities(items);
    if(generated.illustrationWarning)toast('Atividade criada, mas a ilustração falhou.');
    location.href='atividade.html?id='+item.id;
  }catch(err){alert(err.message)}finally{button.disabled=false;button.textContent=original}
};
</script></body></html>
