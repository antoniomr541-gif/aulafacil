<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar atividade</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="mobile-nav"><div class="brand"><div class="brand-icon">📖</div><h1>AtivaEdu</h1></div><a class="btn-secondary" href="index.html">Início</a></div>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">📖</div><div><h1>AtivaEdu</h1><small>Sistema de Atividades</small></div></div><nav><a href="index.html">⌂ Início</a><a href="criar-atividade.html">✍ Criar atividade</a><a href="atividades.html">▣ Minhas atividades</a><a href="criar-relatorio.html">🧒 Relatórios BNCC</a></nav><div class="sidebar-bottom"><button class="logout" onclick="logout()">Sair</button></div></aside>
<main><div class="topbar"><div><h2>Criar atividade</h2><p>Escolha o formato e o AtivaEdu monta o exercício pronto para imprimir.</p></div></div>
<form id="form" class="panel"><div class="form-grid">
<div class="field"><label>Título</label><input id="title" required placeholder="Ex.: Vogais divertidas"></div>
<div class="field"><label>Ano/Série</label><select id="grade" required><option value="">Selecione</option><option>Educação Infantil - G4 (4 anos)</option><option>Educação Infantil - G5 (5 anos)</option><option>1º ano</option><option>2º ano</option><option>3º ano</option><option>4º ano</option><option>5º ano</option><option>6º ano</option><option>7º ano</option><option>8º ano</option><option>9º ano</option></select></div>
<div class="field"><label>Disciplina</label><select id="subject" required><option value="">Selecione</option><option>Educação Infantil / Campos de Experiência</option><option>Matemática</option><option>Língua Portuguesa</option><option>Ciências</option><option>História</option><option>Geografia</option></select></div>
<div class="field"><label>Tema</label><input id="topic" required placeholder="Ex.: vogais, animais, números até 10"></div>
<div class="field"><label>Quantidade</label><input id="quantity" type="number" min="1" max="30" value="5"></div>
<div class="field"><label>Tipo de atividade</label><select id="questionType"><option value="infantil_mista">Mista infantil</option><option value="pintura">Pintura / Colorir</option><option value="cobrir">Cobrir / Pontilhado</option><option value="ligar">Ligar</option><option value="circular">Circular</option><option value="completar">Completar</option><option value="recortar">Recortar e colar</option><option value="coordenacao">Coordenação motora</option><option value="objetiva">Objetivas</option><option value="discursiva">Discursivas</option><option value="mista">Objetivas + discursivas</option></select></div>
<div class="field"><label>Nível</label><select id="level"><option value="bem_infantil">Bem infantil</option><option value="normal" selected>Normal</option><option value="desafiadora">Desafiadora</option></select></div>
<div class="field full"><label>Instruções adicionais</label><textarea id="instructions" placeholder="Ex.: letras grandes, pouco texto, atividade para imprimir em uma página"></textarea></div>
<div class="field full"><div class="switches"><label class="switch-card"><input id="illustrated" type="checkbox" checked>Com elementos visuais</label><label class="switch-card"><input id="adapted" type="checkbox">Adaptada para TEA/TDAH</label><label class="switch-card"><input id="blackWhite" type="checkbox" checked>Preto e branco</label></div></div>
<div class="field full"><button class="btn-primary">Gerar atividade</button></div></div></form></main></div>
<script src="app.js"></script><script>
const user=requireAuth();if(qs('adaptada'))adapted.checked=true;
function adaptDefaults(){const ei=/Educação Infantil|G4|G5/i.test(grade.value);if(ei){level.value='bem_infantil';if(['objetiva','discursiva','mista'].includes(questionType.value))questionType.value='infantil_mista';}}
grade.addEventListener('change',adaptDefaults);
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button.btn-primary'),original=button.textContent;button.disabled=true;button.textContent='Montando atividade...';try{const payload={subject:subject.value,grade:grade.value,topic:topic.value.trim(),quantity:Number(quantity.value),questionType:questionType.value,level:level.value,illustrated:illustrated.checked,adapted:adapted.checked,blackWhite:blackWhite.checked,instructions:instructions.value.trim()};const response=await fetch('/api/generate-activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const generated=await response.json();if(!response.ok)throw new Error(generated.error||'Não foi possível gerar a atividade.');const item={id:Date.now(),userId:user.id,title:title.value.trim()||generated.title,grade:payload.grade,subject:payload.subject,topic:payload.topic,questionType:payload.questionType,level:payload.level,illustrated:payload.illustrated,adapted:payload.adapted,blackWhite:payload.blackWhite,instructions:payload.instructions,questions:generated.questions,createdAt:new Date().toISOString()};const items=Store.getActivities();items.unshift(item);Store.saveActivities(items);location.href='atividade.html?id='+item.id;}catch(err){alert(err.message)}finally{button.disabled=false;button.textContent=original}};
</script></body></html>
