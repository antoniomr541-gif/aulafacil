<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividade</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="mobile-nav"><div class="brand"><div class="brand-icon">📖</div><h1>AtivaEdu</h1></div><a class="btn-secondary" href="atividades.html">Voltar</a></div>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brand-icon">📖</div><div><h1>AtivaEdu</h1><small>Sistema de Atividades</small></div></div>
<nav><a href="index.html">⌂ Início</a><a href="criar-atividade.html">✍ Criar atividade</a><a href="atividades.html">▣ Minhas atividades</a><a href="criar-relatorio.html">🧒 Relatórios BNCC</a></nav>
<div class="sidebar-bottom"><button class="logout" onclick="logout()">Sair</button></div>
</aside>
<main><div class="topbar no-print"><div><h2>Visualizar atividade</h2><p>Revise antes de imprimir.</p></div><div class="actions"><button class="btn-secondary" onclick="toggleAnswers()">Mostrar/ocultar gabarito</button><button class="btn-primary" onclick="window.print()">Imprimir / Salvar PDF</button></div></div><section id="sheet" class="panel"></section></main></div>
<script src="app.js"></script><script>
const user=requireAuth(),item=Store.getActivities().find(a=>String(a.id)===qs('id')&&a.userId===user.id);let show=true;
function render(){if(!item){sheet.innerHTML='<div class="empty">Atividade não encontrada.</div>';return}const illustration=item.illustration?'<figure class="activity-illustration"><img src="'+item.illustration+'" alt="Ilustração educativa sobre '+escapeHtml(item.topic)+'"></figure>':'';sheet.innerHTML='<div class="result-head"><div><h2>'+escapeHtml(item.title)+'</h2><p><strong>'+escapeHtml(item.subject)+'</strong> • '+escapeHtml(item.grade)+' • Tema: '+escapeHtml(item.topic)+'</p><p>Aluno(a): __________________________________ Data: ____/____/______</p></div><div>'+(item.adapted?'🧩 Adaptada':'')+'</div></div><hr style="border:0;border-top:1px solid #eee">'+illustration+item.questions.map((q,i)=>'<div class="question"><strong>'+(i+1)+'. '+escapeHtml(q.prompt)+'</strong>'+(q.options?'<div class="options">'+q.options.map((o,j)=>'<div>'+'ABCD'[j]+') '+escapeHtml(o)+'</div>').join('')+'</div>':'<div style="height:70px"></div>')+'<div class="answer '+(show?'':'hidden')+'"><strong>Gabarito:</strong> '+escapeHtml(q.answer)+'</div></div>').join('')}
function toggleAnswers(){show=!show;render()}render();
</script></body></html>
